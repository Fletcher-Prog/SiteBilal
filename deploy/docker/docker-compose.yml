name: vitritrack
services:
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "127.0.0.1:4002:3001"
    environment:
      - PORT=3001
      - DB_PATH=/app/data/vitritrack.db
      - JWT_SECRET=${JWT_SECRET:-vitritrack-secret-change-me}
    volumes:
      - data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/vitrines"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  data:
