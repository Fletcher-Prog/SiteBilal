name: Deploy VitriTrack

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS: root@srv1251382.hstgr.cloud
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H srv1251382.hstgr.cloud >> ~/.ssh/known_hosts 2>/dev/null
          git archive --format=tar.gz HEAD | ssh -4 -i ~/.ssh/deploy_key "$VPS" "deploy-vitritrack"

      - name: Health check
        run: |
          echo "Waiting for deploy..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://vitritrack.anasdev.cloud/api/vitrines 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Site is live!"
              exit 0
            fi
            echo "Attempt $i/30 — status: $STATUS"
            sleep 5
          done
          echo "❌ Health check failed"
          exit 1
